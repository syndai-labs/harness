# Syndai Labs repository baseline for alint (https://github.com/asamarts/alint).
#
# Every repository extends this file from its own .alint.yml, pinned to a
# commit and to the SHA-256 of these bytes:
#
#   extends:
#     - https://raw.githubusercontent.com/syndai-labs/harness/<commit>/baseline.yml#sha256-<hex>
#
# A repository overrides a rule by redeclaring its id with only the fields it
# changes. A fetched ruleset may not run commands; repository-specific checks
# that need a script belong in the repository's own .alint.yml.
version: 1

rules:
  # --- Root files ----------------------------------------------------------
  # One rule per file: file_exists with a list passes when any one exists.
  - id: layout-root-editorconfig
    kind: file_exists
    paths: .editorconfig
    root_only: true
    level: error
    message: "Ship a root .editorconfig so every editor writes the same whitespace."
    policy_url: "https://editorconfig.org/"

  - id: layout-root-gitattributes
    kind: file_exists
    paths: .gitattributes
    root_only: true
    level: error
    message: "Ship a root .gitattributes that normalizes line endings (`* text=auto eol=lf`)."

  - id: layout-gitattributes-normalizes
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\*\s+text='
    level: error
    message: ".gitattributes must normalize line endings with a `* text=...` line."

  - id: layout-root-readme
    kind: file_exists
    paths: README.md
    root_only: true
    level: error
    message: "Ship a root README.md."

  - id: layout-root-license
    kind: file_exists
    paths: LICENSE
    root_only: true
    level: error
    message: "Ship a root LICENSE."

  - id: layout-root-changelog
    kind: file_exists
    paths: CHANGELOG.md
    root_only: true
    level: error
    message: "Ship a root CHANGELOG.md."

  # --- Agent instructions --------------------------------------------------
  - id: layout-root-agents
    kind: file_exists
    paths: AGENTS.md
    root_only: true
    level: error
    message: "Ship a root AGENTS.md: the one source of instructions for coding agents."
    policy_url: "https://agents.md"

  - id: layout-root-claude
    kind: file_exists
    paths: CLAUDE.md
    root_only: true
    level: error
    message: "Ship a root CLAUDE.md that imports AGENTS.md."

  - id: layout-claude-imports-agents
    kind: file_content_matches
    paths: CLAUDE.md
    pattern: '(?m)^@AGENTS\.md\s*$'
    level: error
    message: "CLAUDE.md must import AGENTS.md (`@AGENTS.md`) so agents share one set of instructions."

  # --- Architecture decision records ---------------------------------------
  - id: adr-dir
    kind: dir_exists
    paths: docs/adr
    level: error
    message: "Architecture decisions live in docs/adr/."

  - id: adr-scaffold
    kind: dir_contains
    select: docs/adr
    require: [README.md, template.md]
    level: error
    message: "docs/adr/ needs its index (README.md) and its template (template.md)."

  - id: adr-first-record
    # ADR-0001 records the decision to keep ADRs; adr-indexed also needs one to exist.
    kind: file_exists
    paths: "docs/adr/0001-*.md"
    level: error
    message: "Start docs/adr/ with ADR-0001, the decision to record architecture decisions."
    policy_url: "https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions"

  - id: adr-dir-only-records
    kind: dir_only_contains
    select: docs/adr
    allow: ["README.md", "template.md", "[0-9][0-9][0-9][0-9]-*.md", "*.txt"]
    level: error
    message: "docs/adr/ holds only ADRs, the index, the template, and plain-text lists."

  - id: adr-filename
    kind: filename_regex
    paths: ["docs/adr/*.md", "!docs/adr/README.md", "!docs/adr/template.md"]
    stem: true
    pattern: '^\d{4}-[a-z0-9]+(-[a-z0-9]+)*$'
    level: error
    message: "Name an ADR NNNN-kebab-title.md (four digits, then a lowercase kebab title)."

  - id: adr-header
    kind: file_content_matches
    paths: "docs/adr/[0-9][0-9][0-9][0-9]-*.md"
    pattern: '\A# ADR-\d{4}: \S.*\n\n- Status: (Proposed|Accepted|Deprecated|Superseded)\n- Date: \d{4}-\d{2}-\d{2}\n'
    level: error
    message: "Open an ADR with '# ADR-NNNN: Title', a blank line, '- Status: Proposed|Accepted|Deprecated|Superseded', and '- Date: YYYY-MM-DD'."

  - id: adr-sections
    kind: file_content_matches
    paths: "docs/adr/[0-9][0-9][0-9][0-9]-*.md"
    pattern: '(?ms)^## Context$.*^## Decision$.*^## Consequences$.*^## Alternatives considered$'
    level: error
    message: "An ADR has ## Context, ## Decision, ## Consequences, and ## Alternatives considered, in that order; other sections may sit between them."

  - id: adr-superseded-names-successor
    kind: file_content_forbidden
    paths: "docs/adr/[0-9][0-9][0-9][0-9]-*.md"
    pattern: '(?ms)\A.*^- Status: Superseded$.*^- Superseded-by: none$'
    level: error
    message: "A Superseded ADR names its successor: '- Superseded-by: ADR-NNNN'."

  - id: adr-indexed
    kind: cross_file
    relation: registered
    source: { files: "docs/adr/[0-9][0-9][0-9][0-9]-*.md" }
    register_as: "{basename}"
    targets:
      - { file: docs/adr/README.md, extract: { regex: '\]\((\d{4}-[a-z0-9-]+\.md)\)' } }
    level: error
    message: "List every ADR in docs/adr/README.md."

  - id: adr-index-links-resolve
    kind: markdown_links_resolve
    paths: docs/adr/README.md
    level: error
    message: "Every link in docs/adr/README.md points at a file that exists."

  # --- Text hygiene (.editorconfig, enforced) ------------------------------
  - id: text-final-newline
    kind: final_newline
    paths: "**/*.{rs,toml,md,mdx,yml,yaml,json,sh,py}"
    level: error
    message: "End the file with a newline."

  - id: text-lf
    kind: line_endings
    paths: "**/*.{rs,toml,md,mdx,yml,yaml,json,sh,py}"
    target: lf
    level: error
    message: "Use LF line endings."

  - id: text-no-trailing-whitespace
    # Markdown is exempt: two trailing spaces are a hard line break.
    kind: no_trailing_whitespace
    paths: "**/*.{rs,toml,yml,yaml,json,sh,py}"
    level: error
    message: "Remove trailing whitespace."

  - id: text-indent-spaces
    # Markdown is exempt: fenced code samples follow their language (Go uses tabs).
    kind: indent_style
    paths: "**/*.{rs,toml,yml,yaml,json,sh,py}"
    style: spaces
    level: error
    message: "Indent with spaces."
